spring:
  application:
    name: hello-server
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: xx889900890
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true  # 启用下划线转驼峰命名
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启SQL日志
    global-config:
      db-config:
        id-type: auto  # 主键自增
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
server:
  port: 8080

logging:
  level:
    com.stu.helloserver: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG

security:
  jwt:
    secret: demo-jwt-secret-key-for-spring-security-2026
    expiration-millis: 7200000